name: progra-web
services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: reservas
      POSTGRES_USER: restaurant_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - database-data:/var/lib/postgresql/data
      - ./docker/database/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./Pagina 1/sample-data.sql:/docker-entrypoint-initdb.d/02-sample-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurant_app -d reservas"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: ./Pagina 1
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8080/api/dishes]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 12
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/reservas
      SPRING_DATASOURCE_USERNAME: restaurant_app
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
    depends_on:
      database:
        condition: service_healthy

  web:
    build: ./Pagina 2
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      app:
        condition: service_healthy

volumes:
  database-data:
