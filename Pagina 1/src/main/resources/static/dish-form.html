<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nuevo platillo</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/dish-form.js"></script>
</head>
<body>
  <header><h1 id="form-title">Nuevo platillo</h1></header>
  <main>
    <form id="dish-form">
      <label for="name">Nombre</label>
      <input id="name" name="name" required maxlength="100">
      <label for="category">Categoría</label>
      <input id="category" name="category" placeholder="Entrada, plato fuerte, postre..." required maxlength="100">
      <label for="description">Descripción</label>
      <textarea id="description" name="description" rows="3" maxlength="500"></textarea>
      <label for="price">Precio ($)</label>
      <input id="price" name="price" type="number" min="0" max="99999999.99" step="0.01" required>
      <label class="checkbox"><input id="available" name="available" type="checkbox" checked> Disponible</label>
      <div class="actions"><button id="save" type="submit" disabled>Guardar platillo</button></div>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
    <button id="retry" type="button" hidden>Volver a cargar</button>
  </main>
  <footer><a id="back" class="button" href="/">Regresar</a></footer>
</body>
</html>
