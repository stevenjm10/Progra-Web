<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Platillos del restaurante</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/dishes.js"></script>
</head>
<body>
  <header>
    <h1>Platillos del restaurante</h1>
    <nav aria-label="Páginas">
      <a href="/" aria-current="page">Inicio</a>
    </nav>
  </header>
  <main>
    <div class="actions">
      <a class="button" href="/dish-list.html">Lista de platillos</a>
      <a class="button" href="/dish-form.html">Nuevo platillo</a>
    </div>
    <section aria-labelledby="menu-title">
      <h2 id="menu-title">Nuestro menú</h2>
      <label for="search">Buscar por nombre, categoría o descripción</label>
      <input id="search" type="search" placeholder="Buscar platillos..." autocomplete="off" disabled>
      <p id="status" role="status" aria-live="polite">Cargando platillos...</p>
      <button id="retry" type="button" hidden>Volver a cargar</button>
      <div id="cards" class="grid dishes" aria-label="Platillos disponibles"></div>
    </section>
  </main>
  <footer><a href="#">Regresar arriba</a></footer>
</body>
</html>
