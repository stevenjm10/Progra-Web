<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lista de platillos</title>
  <link rel="stylesheet" href="/estilos.css">
  <script type="module" src="/lista-platillos.js"></script>
</head>
<body>
  <header><h1>Lista de platillos</h1></header>
  <main>
    <p id="estado" role="status" aria-live="polite">Cargando platillos...</p>
    <button id="reintentar" type="button" hidden>Volver a cargar</button>
    <div class="tabla-contenedor">
      <table>
        <thead><tr><th>Nombre</th><th>Categoría</th><th>Precio</th><th>Disponible</th><th>Operaciones</th></tr></thead>
        <tbody id="filas"></tbody>
      </table>
    </div>
    <p id="mensaje" role="status" aria-live="polite"></p>
  </main>
  <footer><a class="boton" href="/">Regresar</a></footer>
</body>
</html>
