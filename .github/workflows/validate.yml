name: Validate projects

on:
  push:
    branches: [test, main]
  pull_request:
    branches: [test, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-path:
    name: Release path
    runs-on: ubuntu-latest
    steps:
      - name: Require the test branch for main pull requests
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          SOURCE: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$EVENT" = "pull_request" ] && [ "$BASE" = "main" ]; then
            if [ "$HEAD" != "test" ] || [ "$SOURCE" != "$REPOSITORY" ]; then
              echo "Promote the validated test branch through a pull request to main."
              exit 1
            fi
          fi

  dishes:
    name: Java and dish UI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_database_password
          POSTGRES_DB: reservas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reservas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/reservas
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ci_database_password
      PLAYWRIGHT_CHANNEL: chromium
    defaults:
      run:
        working-directory: Pagina 1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: Pagina 1/pom.xml
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Pagina 1/package-lock.json
      - name: Java endpoint tests
        run: ./mvnw --batch-mode test
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Seed isolated CI database
        env:
          PGPASSWORD: ci_database_password
        run: |
          psql -h localhost -U postgres -d reservas -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE dish (
            id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            name VARCHAR(255), category VARCHAR(255), description VARCHAR(500),
            price NUMERIC(10,2), available BOOLEAN
          );
          SQL
          psql -h localhost -U postgres -d reservas -v ON_ERROR_STOP=1 -f sample-data.sql
      - name: Browser CRUD and navigation tests
        run: npm run test:e2e
      - name: Upload test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: dish-test-evidence
          path: |
            Pagina 1/artifacts/
            Pagina 1/target/surefire-reports/
          retention-days: 14

  characters:
    name: Character UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_CHANNEL: chromium
    defaults:
      run:
        working-directory: Pagina 2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Pagina 2/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Deterministic character UI tests
        run: npm run test:e2e
      - name: Upload test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: character-test-evidence
          path: Pagina 2/artifacts/
          retention-days: 14
